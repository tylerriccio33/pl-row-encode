name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Maintains a release PR off main; merging it bumps Cargo.toml + Cargo.lock,
      # updates CHANGELOG.md, tags vX.Y.Z, and publishes a GitHub Release (which
      # triggers publish.yml to build + upload wheels to PyPI).
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
