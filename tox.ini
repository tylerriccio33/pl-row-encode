[tox]
requires =
    tox>=4.21
    tox-uv>=1.13
env_list =
    py{312,313,314}-{test,lint,type}

[testenv]
# Builds the Rust extension via the maturin backend when installing the project.
runner = uv-venv-lock-runner
description = run {envname} checks
dependency_groups = dev
commands =
    test: pytest {posargs}
    lint: ruff format --check
    lint: ruff check
    type: ty check
